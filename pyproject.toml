[project]
name = "stay-active"
version = "0.1.0"
description = "Keep Teams status active with randomized mouse activity"
requires-python = ">=3.12"
dependencies = [
    "pynput>=1.8.2",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "ruff>=0.16.8",
    "types-pynput>=1.8.1.20260712",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "PL", "N", "C4", "PTH", "RET", "ARG"]

[tool.mypy]
strict = true
warn_unreachable = true
